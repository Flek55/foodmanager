name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          go -C backend generate ./...
          git diff --exit-code -- backend/internal/api
      - run: go -C backend vet ./...
      - run: go -C backend test ./...
      - run: go -C backend build ./cmd/server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Generated types are up to date
        run: |
          npm --prefix frontend run gen:api
          git diff --exit-code -- frontend/src/api/schema.d.ts
      - run: npm --prefix frontend run build
