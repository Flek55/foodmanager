name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: foodmanager
          POSTGRES_PASSWORD: foodmanager
          POSTGRES_DB: foodmanager
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U foodmanager"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://foodmanager:foodmanager@localhost:5433/foodmanager?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        run: |
          docker run --rm -v "$PWD/backend:/src" -w /src sqlc/sqlc:1.30.0 generate
          go -C backend generate ./...
          git diff --exit-code -- backend/internal/api backend/internal/store
      - run: go -C backend vet ./...
      - run: go -C backend test ./...
      - run: go -C backend build ./cmd/server

  docker:
    # The exact image the server builds: catches a broken Dockerfile before
    # it reaches deploy/update.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production image
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t foodmanager:ci .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Generated types are up to date
        run: |
          npm --prefix frontend run gen:api
          git diff --exit-code -- frontend/src/api/schema.d.ts
      - run: npm --prefix frontend run build
