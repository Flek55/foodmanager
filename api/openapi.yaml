openapi: 3.0.3
info:
  title: Foodmanager API
  version: 0.2.0
  description: |
    API семейного списка покупок и учёта запасов.
    Единственный источник правды для контракта: из этого файла генерируются
    Go-сервер (oapi-codegen) и TypeScript-клиент (openapi-typescript).

    Аутентификация: httpOnly cookie `fm_session`, её ставят /auth/register и /auth/login.
    Ошибки всегда приходят в формате `Error` с машиночитаемым `code`.

    Живые обновления: `GET /api/households/{householdId}/events` — поток
    Server-Sent Events (не описан как операция, потому что это не JSON).
    Сначала приходит событие `ready` с `{"version": N}`, затем при каждом
    изменении данные `{"kind": "list", "version": N}` или `{"kind": "household"}`
    (поменялись участники или название). Клиент в ответ перечитывает данные.
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: system
  - name: auth
  - name: households
  - name: invites
  - name: list
  - name: catalog
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и базы данных
      tags: [system]
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Сервис запущен, но зависимость недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/register:
    post:
      operationId: register
      summary: Регистрация по email и паролю
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Аккаунт создан, сессия открыта
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      operationId: login
      summary: Вход по email и паролю
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Сессия открыта
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      summary: Выход (закрывает текущую сессию)
      tags: [auth]
      responses:
        "204":
          description: Сессия закрыта
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"

  /me:
    get:
      operationId: getMe
      summary: Текущий пользователь и его семьи
      tags: [auth]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /households:
    post:
      operationId: createHousehold
      summary: Создать семью (создатель становится владельцем)
      tags: [households]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "201":
          description: Семья создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getHousehold
      summary: Семья и её участники
      tags: [households]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateHousehold
      summary: Переименовать семью (только владелец)
      tags: [households]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeMember
      summary: Исключить участника (владелец) или выйти из семьи (сам себя)
      description: |
        Если выходит последний владелец, права владельца переходят к участнику,
        который состоит в семье дольше всех. Если выходит последний человек,
        семья удаляется вместе со всеми данными.
      tags: [households]
      responses:
        "204":
          description: Участник удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /households/{householdId}/invites:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: listInvites
      summary: Действующие инвайт-коды семьи
      tags: [invites]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createInvite
      summary: Создать инвайт-код (любой участник)
      tags: [invites]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Код создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/invites/{code}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InviteCode"
    delete:
      operationId: revokeInvite
      summary: Отозвать инвайт-код
      tags: [invites]
      responses:
        "204":
          description: Код отозван
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /invites/{code}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      operationId: previewInvite
      summary: Куда приглашает код (можно без входа)
      tags: [invites]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /invites/{code}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      operationId: acceptInvite
      summary: Вступить в семью по коду
      tags: [invites]
      responses:
        "200":
          description: Вы в семье (если уже были в ней, ничего не меняется)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /households/{householdId}/list:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: getList
      summary: Всё для экрана списка покупок одним запросом
      description: |
        Позиции списка (в том числе купленные, пока их не убрали), справочник
        товаров семьи (для автодополнения), категории и магазины.
        `version` — текущая версия данных семьи; она растёт с каждым изменением.
      tags: [list]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/sync:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      operationId: syncList
      summary: Изменения списка после версии `since` (для офлайн-клиента)
      description: |
        Возвращает всё, что изменилось с версии `since`: новые и изменённые
        записи и id удалённых. Клиент применяет это к своему снимку и
        запоминает новую `version`. Если `since` больше текущей версии
        (например, база пересоздана), клиент должен заново загрузить /list.
      tags: [list]
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/items:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: addItem
      summary: Добавить товар в список
      description: |
        Товар ищется в справочнике семьи по названию без учёта регистра; если
        его нет, он создаётся, а категория угадывается по названию.
        Если этот товар уже есть в списке (не куплен), новая позиция не
        создаётся: у существующей обновляются переданные количество,
        комментарий и магазин, и ответ приходит с кодом 200.
        Повтор запроса с тем же `id` безопасен (идемпотентность для офлайна).
      tags: [list]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddItemRequest"
      responses:
        "201":
          description: Позиция добавлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "200":
          description: Товар уже был в списке, позиция обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /households/{householdId}/items/clear-checked:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: clearCheckedItems
      summary: Убрать из списка все купленные позиции
      tags: [list]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearCheckedResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: updateItem
      summary: Изменить позицию и её товар
      description: |
        Полная замена редактируемых полей: необязательное поле, которого нет
        в запросе, очищается. `name`, `description` и `categoryId` относятся
        к товару и меняются для него везде.
      tags: [list]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItemRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteItem
      summary: Удалить позицию из списка
      tags: [list]
      responses:
        "204":
          description: Удалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/items/{itemId}/checked:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/ItemId"
    put:
      operationId: setItemChecked
      summary: Отметить позицию купленной или вернуть в список
      tags: [list]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCheckedRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /households/{householdId}/stores:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: createStore
      summary: Добавить магазин
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/stores/{storeId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: storeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateStore
      summary: Переименовать магазин
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStore
      summary: Удалить магазин (позиции остаются, но без магазина)
      tags: [catalog]
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/categories:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      operationId: createCategory
      summary: Добавить категорию (в конец)
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/categories/order:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    put:
      operationId: reorderCategories
      summary: Задать порядок категорий (как отделы идут в магазине)
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Категории в новом порядке
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /households/{householdId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateCategory
      summary: Переименовать категорию или сменить эмодзи
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCategory
      summary: Удалить категорию (товары остаются без категории)
      tags: [catalog]
      responses:
        "204":
          description: Удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fm_session

  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      name: code
      in: path
      required: true
      description: Код без учёта регистра, дефис необязателен
      schema:
        type: string
        example: K7QM-2XPA

  headers:
    SetSessionCookie:
      description: Сессионная cookie `fm_session` (HttpOnly)
      schema:
        type: string

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нужно войти
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт с текущим состоянием
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Слишком много попыток
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
          example: dev

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: not_found
        message:
          type: string
          description: Человекочитаемое сообщение на русском
        field:
          type: string
          description: Поле запроса, к которому относится ошибка валидации
          example: email

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 50

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    Role:
      type: string
      enum: [owner, member]

    HouseholdSummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    Me:
      type: object
      required: [user, households]
      properties:
        user:
          $ref: "#/components/schemas/User"
        households:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdSummary"

    HouseholdInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60

    Member:
      type: object
      required: [userId, displayName, role, joinedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time

    HouseholdDetail:
      type: object
      required: [id, name, role, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
          description: Роль текущего пользователя
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    InviteInput:
      type: object
      properties:
        maxUses:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        ttlHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168

    Invite:
      type: object
      required: [code, maxUses, uses, expiresAt, createdBy]
      properties:
        code:
          type: string
          example: K7QM-2XPA
        maxUses:
          type: integer
        uses:
          type: integer
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Имя того, кто создал код

    InvitePreview:
      type: object
      required: [householdName, invitedBy, memberCount]
      properties:
        householdName:
          type: string
        invitedBy:
          type: string
        memberCount:
          type: integer

    Unit:
      type: string
      description: "Единица количества: штуки, килограммы, граммы, литры, миллилитры, упаковки"
      enum: [pcs, kg, g, l, ml, pack]

    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        sortOrder:
          type: integer
        key:
          type: string
          description: Ключ встроенной категории (dairy, produce, ...), у своих категорий отсутствует

    Store:
      type: object
      required: [id, name, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer

    Product:
      type: object
      required: [id, name, useCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        defaultUnit:
          $ref: "#/components/schemas/Unit"
        defaultStoreId:
          type: string
          format: uuid
        useCount:
          type: integer
          description: Сколько раз товар добавляли в список (для сортировки подсказок)

    ListItem:
      type: object
      required: [id, productId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        quantity:
          type: number
          format: double
        unit:
          $ref: "#/components/schemas/Unit"
        note:
          type: string
        storeId:
          type: string
          format: uuid
        addedBy:
          type: string
          description: Имя того, кто добавил
        createdAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
          description: Когда отметили купленным; отсутствует, если ещё не куплено
        checkedBy:
          type: string
          description: Имя того, кто отметил купленным

    ListSnapshot:
      type: object
      required: [version, items, products, categories, stores]
      properties:
        version:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"

    SyncResponse:
      type: object
      required: [version, items, products, categories, stores, deleted]
      properties:
        version:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        stores:
          type: array
          items:
            $ref: "#/components/schemas/Store"
        deleted:
          $ref: "#/components/schemas/Tombstones"

    Tombstones:
      type: object
      description: Id записей, удалённых после `since`
      required: [items, products, categories, stores]
      properties:
        items:
          type: array
          items:
            type: string
            format: uuid
        products:
          type: array
          items:
            type: string
            format: uuid
        categories:
          type: array
          items:
            type: string
            format: uuid
        stores:
          type: array
          items:
            type: string
            format: uuid

    AddItemRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Id новой позиции, сгенерированный клиентом (необязателен)
        name:
          type: string
          minLength: 1
          maxLength: 80
        quantity:
          type: number
          format: double
        unit:
          $ref: "#/components/schemas/Unit"
        note:
          type: string
          maxLength: 200
        storeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          description: Явная категория товара; без неё у нового товара категория угадывается

    UpdateItemRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        quantity:
          type: number
          format: double
        unit:
          $ref: "#/components/schemas/Unit"
        note:
          type: string
          maxLength: 200
        storeId:
          type: string
          format: uuid

    SetCheckedRequest:
      type: object
      required: [checked]
      properties:
        checked:
          type: boolean

    ClearCheckedResult:
      type: object
      required: [removed]
      properties:
        removed:
          type: integer

    StoreInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        emoji:
          type: string
          maxLength: 16

    ReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Id всех категорий семьи в нужном порядке
          items:
            type: string
            format: uuid
