openapi: 3.0.3
info:
  title: Foodmanager API
  version: 0.1.0
  description: |
    API семейного списка покупок и учёта запасов.
    Единственный источник правды для контракта: из этого файла генерируются
    Go-сервер (oapi-codegen) и TypeScript-клиент (openapi-typescript).
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и базы данных
      tags: [system]
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Сервис запущен, но зависимость недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, database, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
        version:
          type: string
          example: dev
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: not_found
        message:
          type: string
          description: Человекочитаемое сообщение
