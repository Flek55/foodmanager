# Production stack. On the server, from the repo root:
#
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only Caddy is reachable from outside (80/443); the app and Postgres live
# on an internal Docker network.

name: foodmanager

x-logging: &logging
  # Docker keeps container logs forever by default — cap them.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates — keep this volume!
      - caddy_config:/config
    logging: *logging

  app:
    build:
      context: ..
      args:
        VERSION: ${VERSION:-dev}
    image: foodmanager:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foodmanager:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/foodmanager?sslmode=disable
      # Caddy sets X-Real-IP; the app is not reachable except through it.
      TRUST_PROXY: "true"
      # Used on Telegram buttons and registered as the bot's Mini App.
      PUBLIC_URL: https://${DOMAIN}
      # Empty = no bot; the app works without it.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: foodmanager
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodmanager -d foodmanager"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # Nightly pg_dump into deploy/backups, keeping the last BACKUP_KEEP_DAYS.
  # Copy these files off the server now and then (see docs/DEPLOY.md).
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: foodmanager
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: foodmanager
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/foodmanager-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump --no-owner | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "backup ok: $$file"
          else
            rm -f "$$file.tmp"; echo "backup FAILED" >&2
          fi
          find /backups -name 'foodmanager-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
